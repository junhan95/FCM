<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1897.55 1028.77">
<title>Frankonia</title>
<!-- The light-header lockup, traced from the head office's own artwork:
     "Frankonia Logo - Dark Red.pdf" in 00_Sales Materials. That file is the
     Dark Red variant of the group mark — the knot set in CMYK 0/100/100/10
     and the wordmark in solid K, where "Frankonia Logo - Red.pdf" carries the
     knot at 0/100/100/0. The 10% black is the whole difference between the
     two, and it is the "dark red, which is not so dominant" the August review
     asked for.

     #c3171d is that conversion: the site's own red (#d91920, itself the
     0/100/100/0 plate) with the 10% plate applied. On paper it measures
     6.07:1 against white, where the brighter red measures 5.11.

     The wordmark is the ink token (#25282b) rather than the artwork's pure
     black — the same near-black every other piece of type on this site is set
     in, and indistinguishable from #000 at a 44px lockup. Nothing else on the
     site uses true black, and one element that did would show.

     Token names are spelled out above rather than written with their two
     leading hyphens on purpose: an SVG is parsed as XML, where a double hyphen
     inside a comment is a hard parse error and the browser drops the whole
     document. It renders as a broken image, not as an unstyled one.

     Generated from frankonia-logo.svg by swapping the knot fill and the one
     <g fill> — keep the two files in step if the artwork is ever replaced. -->
