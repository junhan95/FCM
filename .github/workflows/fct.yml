name: Check FCT app
on:
  push:
    branches: [main]
    paths: ['fct/**', '.github/workflows/fct.yml']
  pull_request:
    paths: ['fct/**', '.github/workflows/fct.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fct/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
